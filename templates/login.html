<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - AI Smart IT Helpdesk ศาลจังหวัดเพชรบูรณ์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Sarabun', sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- Container หลักจัดกึ่งกลางหน้าจอ -->
    <div class="max-w-md w-full space-y-4">

        <!-- 📌 กรอบการ์ดระบบล็อกอินสีขาว -->
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
            <!-- ส่วนหัวการ์ด -->
            <div class="bg-amber-800 text-white p-6 text-center space-y-1">
                <h1 class="text-xl font-bold">ศาลจังหวัดเพชรบูรณ์</h1>
                <p class="text-xs text-amber-100">ระบบแจ้งซ่อมและสนับสนุนงานไอทีอัจฉริยะ (AI Helpdesk)</p>
            </div>

            <div class="p-6 space-y-6">
                <!-- ส่วนเช็กสถานะด่วน (Quick Check) -->
                <div class="bg-amber-50/70 border border-amber-200 p-4 rounded-xl space-y-2">
                    <label class="block text-xs font-bold text-amber-900 flex items-center gap-1">
                        🔍 เช็กสถานะการแจ้งซ่อมด่วน (Quick Check)
                    </label>
                    <form action="/quick-check" method="POST" class="flex gap-2">
                        <input type="text" name="ticket_id" placeholder="กรอกเลข Ticket (เช่น TK-1001)" required class="flex-1 p-2 text-xs border border-amber-300 rounded-lg focus:ring-2 focus:ring-amber-600 bg-white">
                        <button type="submit" class="bg-amber-700 hover:bg-amber-800 text-white px-4 py-2 rounded-lg text-xs font-semibold transition shadow">
                            ตรวจสอบ
                        </button>
                    </form>
                </div>

                <div class="relative flex py-1 items-center">
                    <div class="flex-grow border-t border-slate-200"></div>
                    <span class="flex-shrink mx-4 text-slate-400 text-xs">หรือ เข้าสู่ระบบด้วยรหัสบุคลากร</span>
                    <div class="flex-grow border-t border-slate-200"></div>
                </div>

                <!-- ฟอร์มเข้าสู่ระบบ -->
                <form action="/login" method="POST" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">รหัสบุคลากร (8 หลัก)</label>
                        <input type="text" name="user_id" placeholder="เช่น 10000001" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-slate-900 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">รหัสผ่าน</label>
                        <input type="password" name="password" placeholder="••••••••" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-slate-900 focus:outline-none">
                    </div>
                    <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white py-2.5 rounded-lg font-semibold transition shadow text-sm">
                        เข้าสู่ระบบ
                    </button>
                </form>
            </div>

            <!-- ส่วนท้ายการ์ด (Footer ภายในกรอบ) -->
            <div class="bg-slate-50 p-3 text-center border-t border-slate-100">
                <p class="text-[11px] text-slate-400">ระบบสนับสนุนงานเทคโนโลยีสารสนเทศ ศาลจังหวัดเพชรบูรณ์</p>
            </div>
        </div>

        <!-- 📌 ปุ่ม Google Form (อยู่นอกกรอบการ์ด แต่อยู่ใต้กรอบพอดี) -->
        {% if google_form_url %}
        <div>
            <a href="{{ google_form_url }}" target="_blank" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-4 rounded-xl transition text-sm shadow-md flex items-center justify-center gap-2 text-center">
                📝 แบบฟอร์มแจ้งข้อมูล / ประเมินความพึงพอใจ (Google Form)
            </a>
        </div>
        {% endif %}

    </div>

</body>
</html>
